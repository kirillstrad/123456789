name: Light Scene Binding Verification
on:
  push:
    branches: [iteration-5h-light-scene-binding]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: node tools/combat-light-browser-check.mjs
      - name: Print combat light diagnostic report
        if: always()
        run: >-
          node -e "const fs=require('node:fs');const p='docs/combat-light-check.json';if(fs.existsSync(p)){process.stdout.write(fs.readFileSync(p,'utf8')+'\n');}else{console.error('Combat light diagnostic report was not generated; inspect earlier steps.');}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: combat-light-evidence-${{ matrix.os }}-${{ github.sha }}
          path: |
            docs/combat-light-check.json
            docs/combat-light-lit.png
            docs/combat-light-failure.png
