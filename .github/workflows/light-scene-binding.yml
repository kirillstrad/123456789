name: Light Scene Binding Verification
on:
  push:
    branches: [iteration-5h-light-scene-binding, iteration-5i-test-room-exploration]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: Fire rule and release processor contracts
        run: node --test tests/fire-rules.test.mjs
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - name: Original brazier browser regression
        run: node tools/combat-light-browser-check.mjs
      - name: Nine light variants and lifecycle browser acceptance
        run: node tools/light-variants-browser-check.mjs
      - name: Print combat light diagnostic reports
        if: always()
        run: >-
          node -e "const fs=require('node:fs');for(const p of ['docs/combat-light-check.json','docs/light-acceptance/report.json']){console.log('\nREPORT '+p);if(fs.existsSync(p)){process.stdout.write(fs.readFileSync(p,'utf8')+'\n');}else{console.error('Report was not generated; inspect earlier steps.');}}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: combat-light-evidence-${{ matrix.os }}-${{ github.sha }}
          path: |
            docs/combat-light-check.json
            docs/combat-light-lit.png
            docs/combat-light-failure.png
            docs/light-acceptance/**
