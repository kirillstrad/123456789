name: Light Scene Binding Verification
on:
  push:
    branches: [iteration-5h-light-scene-binding]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: node tools/combat-light-browser-check.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: combat-light-evidence-${{ matrix.os }}-${{ github.sha }}
          path: |
            docs/combat-light-check.json
            docs/combat-light-lit.png
