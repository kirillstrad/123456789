name: Gallery Render Preview
on:
  push:
    branches: [iteration-4e-throne-test]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: node tools/gallery-render-check.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: OBJECT_GALLERY_RENDER_${{ github.sha }}
          path: docs/throne-gallery-*
          if-no-files-found: warn
