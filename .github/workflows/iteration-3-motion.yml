name: Iteration 3B Windows Desktop
on:
  push:
    branches: [iteration-3-motion-desktop]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: iteration-3-motion-desktop
  cancel-in-progress: false
jobs:
  desktop:
    if: github.repository == 'kirillstrad/123456789' && github.ref == 'refs/heads/iteration-3-motion-desktop'
    runs-on: windows-2022
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tools/desktop-prepare.mjs
      - run: npm ci
      - run: npm run build
      - name: Full game and desktop unit tests
        run: |
          set -o pipefail
          npm test | tee docs/unit-tests.tap
      - run: npx playwright install chromium
      - run: npm run test:browser
      - name: Install pinned Electron and capture first lockfile
        run: |
          if [ ! -f desktop/package-lock.json ]; then npm install --prefix desktop --package-lock-only --ignore-scripts; fi
          npm ci --prefix desktop
      - run: node tools/desktop-build.mjs
      - name: Smoke-test packaged Windows executable
        run: node tools/desktop-smoke.mjs
      - name: Stage portable folder outside the source tree
        shell: pwsh
        run: |
          Start-Sleep -Seconds 2
          $target = Join-Path $env:RUNNER_TEMP 'ASH_IRON_3B_1_WIN_X64'
          Move-Item 'dist/ASH_IRON_3B_1_WIN_X64' $target
          Copy-Item 'docs/desktop-check.json' $target
          Copy-Item 'docs/desktop-preview.png' $target
          Compress-Archive -Path $target -DestinationPath (Join-Path $env:RUNNER_TEMP 'ASH_IRON_3B_1_WIN_X64.zip')
      - run: python tools/package.py
      - name: Commit verified source hooks, lockfile and runtime only to iteration 3
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git add src/app/main.js src/app/index.html runtime PLAY.html docs BUILD_INFO.json MANIFEST.json desktop/package-lock.json
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Build and verify iteration 3B.1 Windows desktop'
            git push origin HEAD:refs/heads/iteration-3-motion-desktop
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ASH_IRON_3B_1_WIN_X64
          path: ${{ runner.temp }}/ASH_IRON_3B_1_WIN_X64.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: ASH_IRON_ITERATION_3B_1_SOURCE
          path: ${{ runner.temp }}/ASH_IRON_ITERATION_3B_1.zip
          if-no-files-found: error
